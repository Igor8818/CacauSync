services:
  postgres:
    image: postgres:16-alpine
    container_name: cacausync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cacausync_db
      POSTGRES_USER: cepec_admin
      POSTGRES_PASSWORD: cepec_secret_2026
    ports:
      - "5432:5432"
    volumes:
      - cacausync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cepec_admin -d cacausync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cacausync_pgdata:
